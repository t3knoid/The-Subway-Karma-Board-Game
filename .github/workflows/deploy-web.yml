# Build the Unity Web (WebGL) version in the cloud and publish it to GitHub Pages.
#
# Runs on every push to main that changes the game, or on demand (Actions tab → "Deploy web
# build" → Run workflow). Publishes to the gh-pages branch, the same branch
# tools/deploy_web.sh publishes to, so manual and automatic deploys are interchangeable.
#
# One-time setup (see docs/BUILDING.md → "Automatic deploys"):
#   - Repository secrets UNITY_LICENSE, UNITY_EMAIL, UNITY_PASSWORD (GameCI needs a Unity
#     licence to run the Editor in CI).
#   - Settings → Pages → Deploy from a branch → gh-pages / (root).
name: Deploy web build

on:
  push:
    branches: [main]
    paths:
      - "SubwayKarmaGame/Assets/**"
      - "SubwayKarmaGame/Packages/**"
      - "SubwayKarmaGame/ProjectSettings/**"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

permissions:
  contents: write        # push the gh-pages branch
  pages: read            # report which branch Pages serves, and the site address
  checks: write          # unity-test-runner posts the test results as a check run

concurrency:             # one deploy at a time; don't cancel one that's publishing
  group: deploy-web
  cancel-in-progress: false

env:
  PROJECT_PATH: SubwayKarmaGame
  UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
  UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
  UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}

jobs:
  test:
    name: EditMode tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check Unity licence secrets
        run: |
          if [ -z "$UNITY_LICENSE" ] || [ -z "$UNITY_EMAIL" ] || [ -z "$UNITY_PASSWORD" ]; then
            echo "::error::Add the UNITY_LICENSE, UNITY_EMAIL and UNITY_PASSWORD repository secrets (see docs/BUILDING.md)."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          lfs: true      # board, card and token images live in Git LFS

      - uses: actions/cache@v4
        with:
          path: ${{ env.PROJECT_PATH }}/Library
          key: Library-test-${{ hashFiles('SubwayKarmaGame/Assets/**', 'SubwayKarmaGame/Packages/**', 'SubwayKarmaGame/ProjectSettings/**') }}
          restore-keys: Library-test-

      - name: Run EditMode tests
        uses: game-ci/unity-test-runner@v4
        with:
          projectPath: ${{ env.PROJECT_PATH }}
          testMode: editmode
          artifactsPath: test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results
          retention-days: 7

  build-and-deploy:
    name: Build WebGL and publish
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      # Unity's Docker image is large; make room on the runner.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false

      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/cache@v4
        with:
          path: ${{ env.PROJECT_PATH }}/Library
          key: Library-WebGL-${{ hashFiles('SubwayKarmaGame/Assets/**', 'SubwayKarmaGame/Packages/**', 'SubwayKarmaGame/ProjectSettings/**') }}
          restore-keys: Library-WebGL-

      - name: Build WebGL
        uses: game-ci/unity-builder@v4
        with:
          projectPath: ${{ env.PROJECT_PATH }}
          targetPlatform: WebGL
          buildName: WebGL
          buildsPath: build
          # unityVersion defaults to "auto": read from ProjectSettings/ProjectVersion.txt

      - name: Check the build will load on GitHub Pages
        run: |
          out=build/WebGL/WebGL
          test -f "$out/index.html" || { echo "::error::No index.html in $out"; ls -R build | head -50; exit 1; }
          # Without Decompression Fallback Unity emits .gz/.br files, which GitHub Pages can't serve correctly.
          if compgen -G "$out/Build/*.gz" > /dev/null || compgen -G "$out/Build/*.br" > /dev/null; then
            echo "::error::Build is compressed without Decompression Fallback (Player Settings > Web > Publishing Settings)."
            exit 1
          fi
          du -sh "$out"

      - name: Keep a copy of the build
        uses: actions/upload-artifact@v4
        with:
          name: webgl-build
          path: build/WebGL/WebGL
          retention-days: 7

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/WebGL/WebGL
          publish_branch: gh-pages
          force_orphan: true          # the branch only ever holds the latest build
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          full_commit_message: Deploy web build from ${{ github.sha }}

      - name: Show the site address
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          url=$(gh api "repos/${{ github.repository }}/pages" --jq .html_url 2>/dev/null || true)
          source=$(gh api "repos/${{ github.repository }}/pages" --jq .source.branch 2>/dev/null || true)
          if [ "$source" != "gh-pages" ]; then
            echo "::warning::GitHub Pages is serving '${source:-nothing}', not gh-pages. Set Settings > Pages > Deploy from a branch > gh-pages / (root)."
          fi
          echo "Published. Site: ${url:-https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/}" >> "$GITHUB_STEP_SUMMARY"
